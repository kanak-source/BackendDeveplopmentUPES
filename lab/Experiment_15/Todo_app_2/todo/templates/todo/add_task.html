{% extends 'todo/base.html' %}


{% block title %}
Add Task | Task Tracker
{% endblock %}


{% block content %}

<section class="panel">

    <h1>Add New Task</h1>

    <p class="description">
        Enter the task you want to add to your list.
    </p>


    <form method="post" class="task-form">

        {% csrf_token %}

        <label for="title">
            Task Title
        </label>

        <input
            id="title"
            type="text"
            name="title"
            maxlength="200"
            placeholder="Enter task title"
            required
        >

        <div class="form-actions">

            <button type="submit">
                Save Task
            </button>

            <a href="{% url 'task_list' %}"
               class="secondary-button">
                Back
            </a>

        </div>

    </form>

</section>

{% endblock %}
